<!DOCTYPE html>

<html>

<head>

<title>CMMS Login</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<style>

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f2f4f7;

}


.login-box{

width:380px;
padding:30px;
background:white;
border-radius:10px;
box-shadow:0px 0px 15px #aaa;

}


.logo{

width:80px;
display:block;
margin:auto;

}

</style>


</head>


<body>


<div class="login-box">


<img src="{{url_for('static',filename='logo.png')}}"
class="logo">


<h3 class="text-center mt-3">
CMMS Login
</h3>


{% if error %}

<p class="text-danger text-center">
{{error}}
</p>

{% endif %}



<form method="POST">


<label>
Username
</label>

<input class="form-control"
name="username"
required>



<label class="mt-3">
Password
</label>


<input type="password"
class="form-control"
name="password"
required>


<button class="btn btn-primary w-100 mt-4">

Login

</button>


</form>


</div>


</body>

</html>
